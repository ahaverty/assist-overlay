name: Build

# Every push to main builds a signed APK and publishes it as a GitHub release (assist.apk + version.json),
# which the app's updater picks up. The version comes from the commit count (app/build.gradle.kts), so
# nobody bumps it by hand. Pull requests build a debug APK without the signing key.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0   # the version is the commit count, and release notes need the last tag

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      # whisper.cpp is most of the build time; ccache keeps its objects between runs.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ndk-27.2-${{ hashFiles('app/src/main/cpp/**', '.gitmodules') }}
          restore-keys: ndk-27.2-
          max-size: 500M

      - name: Tests and debug build (pull requests)
        if: github.event_name == 'pull_request'
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Tests and release build
        if: github.event_name != 'pull_request'
        run: ./gradlew testReleaseUnitTest assembleRelease --console=plain

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: assist-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(git rev-list --count HEAD)
          code=$((100 + n)); name="1.$n"
          # Release notes: commit subjects since the last release, minus any old "1.9: " prefixes.
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          notes=$(git log --no-merges --format='%s' ${prev:+$prev..}HEAD | sed -E 's/^[0-9.]+: //')
          cp app/build/outputs/apk/release/app-release.apk assist.apk
          jq -n --argjson c "$code" --arg n "$name" --arg t "$(echo "$notes" | head -1)"             '{versionCode: $c, versionName: $n, notes: $t}' > version.json
          gh release create "v$name" assist.apk version.json --title "$name"             --notes "$(echo "$notes" | sed 's/^/- /')" --target "$GITHUB_SHA"
